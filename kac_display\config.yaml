name: "KAC Display Bridge"
version: "0.1.0"
slug: "kac_display"
description: "Show Home Assistant entities and images on KAC firmware displays"
url: "https://github.com/highno/kac-home-assistant-addon/tree/main/kac_display"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
homeassistant_api: true
map:
  - type: app_config
    read_only: false
options:
  config_file: "/config/kac.yaml"
  log_level: "info"
  dry_run: false
schema:
  config_file: "str"
  log_level: "list(debug|info|warning|error)"
  dry_run: "bool"
