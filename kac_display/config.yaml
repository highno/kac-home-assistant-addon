name: "KAC Display Bridge"
version: "0.3.2"
slug: "kac_display"
description: "Show Home Assistant entities and images on KAC firmware displays"
url: "https://github.com/highno/kac-home-assistant-addon/tree/main/kac_display"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:monitor-dashboard"
map:
  - type: app_config
    read_only: false
options:
  config_file: "/config/kac.yaml"
  log_level: "info"
  dry_run: false
  update_interval_seconds: 10
  text_mode: "transliterate"
  home_assistant_timeout_seconds: 10
  entities: []
  formats: []
  devices: []
schema:
  config_file: "str"
  log_level: "list(debug|info|warning|error)"
  dry_run: "bool"
  update_interval_seconds: "int(1,3600)"
  text_mode: "list(transliterate|strict)"
  home_assistant_timeout_seconds: "int(1,120)"
  entities:
    - alias: "str"
      entity_id: "str"
  formats:
    - name: "str"
      template: "str"
  devices:
    - name: "str"
      host: "str"
      key: "password"
      timeout_seconds: "int(1,120)"
      rotation_seconds: "int(5,255)"
      brightness_enabled: "bool?"
      brightness: "int(0,100)?"
      timezone: "str?"
      brightness_schedule_enabled: "bool?"
      brightness_day: "int(0,100)?"
      brightness_night: "int(0,100)?"
      night_from: "int(0,23)?"
      night_until: "int(0,23)?"
      pages:
        - title: "str"
          rows:
            - type: "list(heading|value|down|up|bar|big|sparkline|empty)"
              label: "str?"
              entity: "str?"
              format: "str?"
              value: "str?"
              percent: "str?"
              alert: "str?"
              history_points: "int(1,20)?"
              scale_min: "float?"
              scale_max: "float?"
              values_csv: "str?"
      images:
        - slot: "int(1,5)"
          source_type: "list(file|entity)?"
          source: "str?"
          entity_id: "str?"
          fit: "list(cover|contain)?"
          upload: "list(on_change|startup)?"
          delete: "bool?"
          quality: "int(1,100)?"
          max_jpeg_kb: "int(5,1024)?"
          refresh_seconds: "int(60,86400)?"
          gif_colors: "int(2,256)?"
          gif_min_delay_ms: "int(20,60000)?"
